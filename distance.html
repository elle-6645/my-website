<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Distance Calculator</title>
</head>
<body>
  <h2>Distance Calculator</h2>
  <form>
    <label for="lat1">Your Latitude:</label>
    <input type="number" id="lat1" step="any" required>
    <br><br>

    <label for="lon1">Your Longitude:</label>
    <input type="number" id="lon1" step="any" required>
    <br><br>

    <label for="lat2">University Latitude:</label>
    <input type="number" id="lat2" step="any" required>
    <br><br>

    <label for="lon2">University Longitude:</label>
    <input type="number" id="lon2" step="any" required>
    <br><br>

    <button type="button" onclick="calculateDistance()">Calculate Distance</button>
    <button type="button" onclick="goBack()">Back</button>
  </form>

  <h3 id="result"></h3>

  <script>
    function calculateDistance() {
      let lat1 = parseFloat(document.getElementById("lat1").value);
      let lon1 = parseFloat(document.getElementById("lon1").value);
      let lat2 = parseFloat(document.getElementById("lat2").value);
      let lon2 = parseFloat(document.getElementById("lon2").value);

      if (isNaN(lat1) || isNaN(lon1) || isNaN(lat2) || isNaN(lon2)) {
        document.getElementById("result").innerHTML = "⚠️ Please enter all coordinates.";
        return;
      }

      // Convert degrees to radians
      function toRad(value) {
        return value * Math.PI / 180;
      }

      // Haversine formula
      let R = 6371; // Earth radius in km
      let dLat = toRad(lat2 - lat1);
      let dLon = toRad(lon2 - lon1);
      let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
      let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      let distance = R * c;

      document.getElementById("result").innerHTML = "Distance = " + distance.toFixed(2) + " km";
    }

    function goBack() {
      window.location.href = "index.html"; // homepage
    }
  </script>
</body>
</html>
